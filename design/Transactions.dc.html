<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Flowca — Transaksi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#1F1B2D}a:hover{color:#C2321F}
.btn{transition:transform .08s ease, box-shadow .08s ease;cursor:pointer}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #1F1B2D !important}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #1F1B2D !important}
.fld:focus{outline:none;box-shadow:0 0 0 3px #5BC8D6 !important}
.row:hover{background:#FFF0D9 !important}
:focus-visible{outline:3px solid #2A8FA0;outline-offset:2px}
input::placeholder{color:#7A7287}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFF6E5; color: #1F1B2D; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
<header style="padding: 16px 20px 10px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 28px; font-weight: 700">Transaksi</h1>
<div style="display: flex; align-items: center; border: 3px solid #1F1B2D; border-radius: 10px; background: #FFFDF8; box-shadow: 3px 3px 0 #1F1B2D">
<button type="button" aria-label="Bulan sebelumnya" style="width: 40px; height: 40px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F1B2D" stroke-width="3.2" stroke-linecap="square" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<span style="font-size: 14px; font-weight: 700; padding: 0 2px">Nov 2026</span>
<button type="button" aria-label="Bulan berikutnya" style="width: 40px; height: 40px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F1B2D" stroke-width="3.2" stroke-linecap="square" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 3px solid #1F1B2D; border-radius: 12px; background: #FFFDF8; overflow: hidden">
<div style="padding: 10px; display: flex; flex-direction: column; gap: 2px; border-right: 2px dashed #B9AFA0">
<span style="font-size: 11px; font-weight: 700; color: #4A4458">MASUK</span>
<span style="font-size: 14px; font-weight: 700; color: #1E6B40">{{ totalIn }}</span>
</div>
<div style="padding: 10px; display: flex; flex-direction: column; gap: 2px; border-right: 2px dashed #B9AFA0">
<span style="font-size: 11px; font-weight: 700; color: #4A4458">KELUAR</span>
<span style="font-size: 14px; font-weight: 700; color: #B42318">{{ totalOut }}</span>
</div>
<div style="padding: 10px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 700; color: #4A4458">SELISIH</span>
<span style="font-size: 14px; font-weight: 700">{{ net }}</span>
</div>
</div>
<div style="position: relative">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4458" stroke-width="2.6" stroke-linecap="square" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5"/></svg>
<label for="tx-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari transaksi</label>
<input id="tx-search" class="fld" type="search" placeholder="Cari transaksi atau kategori" value="{{ q }}" onChange="{{ onQ }}" style="height: 48px; width: 100%; border: 3px solid #1F1B2D; border-radius: 10px; background: #FFFFFF; padding: 0 14px 0 42px; font-family: inherit; font-size: 16px; color: #1F1B2D">
</div>
<div role="radiogroup" aria-label="Filter jenis" style="display: flex; gap: 8px">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ f.on }}" onClick="{{ f.pick }}" style="min-height: 40px; padding: 0 14px; border: 2px solid #1F1B2D; border-radius: 999px; background: {{ f.bg }}; font-family: inherit; font-size: 14px; font-weight: 700; color: #1F1B2D; cursor: pointer">{{ f.label }}</button>
</sc-for>
</div>
</header>
<main style="flex: 1; overflow-y: auto; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #4A4458; padding: 0 4px">
<span>{{ g.label }}</span><span>{{ g.sum }}</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; background: #FFFDF8; border: 3px solid #1F1B2D; border-radius: 12px; box-shadow: 4px 4px 0 #1F1B2D; overflow: hidden">
<sc-for list="{{ g.items }}" as="t" hint-placeholder-count="2">
<li style="border-top: {{ t.divider }}">
<a href="#detail" class="row" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; text-decoration: none; color: #1F1B2D; background: #FFFDF8">
<span aria-hidden="true" style="width: 40px; height: 40px; border: 2px solid #1F1B2D; border-radius: 10px; background: {{ t.tile }}; display: flex; align-items: center; justify-content: center; font-family: 'Pixelify Sans', monospace; font-size: 18px; font-weight: 700; flex: none">{{ t.initial }}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.name }}</span>
<span style="font-size: 12px; color: #4A4458">{{ t.meta }}</span>
</span>
<span style="font-size: 14px; font-weight: 700; color: {{ t.color }}; white-space: nowrap">{{ t.amount }}</span>
</a>
</li>
</sc-for>
</ul>
</section>
</sc-for>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFDF8; border: 3px dashed #1F1B2D; border-radius: 14px; padding: 28px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<div style="font-family: 'Pixelify Sans', monospace; font-size: 20px; font-weight: 700">{{ emptyTitle }}</div>
<div style="font-size: 14px; color: #4A4458">{{ emptyBody }}</div>
</div>
</sc-if>
</main>
<nav aria-label="Navigasi utama" style="border-top: 3px solid #1F1B2D; background: #FFFDF8; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; padding: 6px 4px 14px; position: relative">
<a href="ProfileMenu.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; text-decoration: none; color: #1F1B2D">
<span aria-hidden="true" style="width: 44px; height: 30px; border: 2px solid transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1B2D" stroke-width="2.4"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg></span>
<span>Beranda</span>
</a>
<a href="Transactions.dc.html" aria-current="page" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; text-decoration: none; color: #1F1B2D">
<span aria-hidden="true" style="width: 44px; height: 30px; border: 2px solid #1F1B2D; background: #FF7A6B; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1B2D" stroke-width="2.4" stroke-linecap="square"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg></span>
<span>Transaksi</span>
</a>
<a href="QuickAdd.dc.html" aria-label="Catat cepat dengan AI: ketik, bicara, atau foto nota" class="btn" style="justify-self: center; align-self: start; margin-top: -26px; width: 64px; height: 64px; border: 3px solid #1F1B2D; border-radius: 16px; background: #FFA94D; box-shadow: 4px 4px 0 #1F1B2D; display: flex; align-items: center; justify-content: center; text-decoration: none; position: relative">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F1B2D" stroke-width="3.4" stroke-linecap="square" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
<span aria-hidden="true" style="position: absolute; top: -9px; right: -11px; border: 2px solid #1F1B2D; border-radius: 4px; background: #FF9EC7; padding: 0 4px; font-family: 'Pixelify Sans', monospace; font-size: 11px; font-weight: 700; line-height: 16px">AI</span>
</a>
<a href="Budget.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; text-decoration: none; color: #1F1B2D">
<span aria-hidden="true" style="width: 44px; height: 30px; border: 2px solid transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1B2D" stroke-width="2.4"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>
<span>Anggaran</span>
</a>
<a href="#accounts" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; text-decoration: none; color: #1F1B2D">
<span aria-hidden="true" style="width: 44px; height: 30px; border: 2px solid transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1B2D" stroke-width="2.4"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 11h5v4h-5z"/></svg></span>
<span>Akun</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dataset":{"editor":"enum","options":["contoh","satu","kosong"],"default":"contoh","section":"Simulasi"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', q: '' };
  }
  rp(n) { return 'Rp ' + Math.abs(n).toLocaleString('id-ID'); }
  renderVals() {
    var self = this, s = this.state;
    var mode = this.props.dataset ?? 'contoh';
    var tiles = { Makanan: '#FFE7C2', Transportasi: '#D8F3F7', Tagihan: '#FFD9E8', Belanja: '#FFD3CC', Gaji: '#C9EFD7', Freelance: '#C9EFD7' };
    var all = [
      { d: '19', name: 'Makan siang', cat: 'Makanan', acct: 'Tunai', time: '12.30', amt: -25000 },
      { d: '19', name: 'Kopi susu', cat: 'Makanan', acct: 'Rekening bank', time: '08.10', amt: -22000 },
      { d: '18', name: 'Ojek ke kantor', cat: 'Transportasi', acct: 'Rekening bank', time: '07.45', amt: -18000 },
      { d: '18', name: 'Token listrik', cat: 'Tagihan', acct: 'Rekening bank', time: '19.20', amt: -150000 },
      { d: '15', name: 'Proyek desain logo', cat: 'Freelance', acct: 'Rekening bank', time: '16.00', amt: 1200000 },
      { d: '14', name: 'Belanja bulanan', cat: 'Belanja', acct: 'Rekening bank', time: '10.15', amt: -432500 },
      { d: '01', name: 'Gaji November', cat: 'Gaji', acct: 'Rekening bank', time: '09.00', amt: 6500000 }
    ];
    var data = mode === 'kosong' ? [] : (mode === 'satu' ? all.slice(0, 1) : all);
    var dayLabel = { '19': 'Hari ini · Kam, 19 Nov', '18': 'Kemarin · Rab, 18 Nov', '15': 'Min, 15 Nov', '14': 'Sab, 14 Nov', '01': 'Min, 1 Nov' };
    var inSum = 0, outSum = 0;
    data.forEach(function (t) { if (t.amt > 0) inSum += t.amt; else outSum += -t.amt; });
    var q = (s.q || '').toLowerCase();
    var shown = data.filter(function (t) {
      if (s.filter === 'out' && t.amt > 0) return false;
      if (s.filter === 'in' && t.amt < 0) return false;
      return !q || (t.name + ' ' + t.cat).toLowerCase().indexOf(q) !== -1;
    });
    var groups = [];
    shown.forEach(function (t) {
      var g = groups[groups.length - 1];
      if (!g || g.key !== t.d) { g = { key: t.d, label: dayLabel[t.d], total: 0, items: [] }; groups.push(g); }
      g.total += t.amt;
      g.items.push({
        name: t.name, initial: t.cat.charAt(0), tile: tiles[t.cat] || '#FFFFFF',
        meta: t.cat + ' · ' + t.acct + ' · ' + t.time,
        amount: (t.amt < 0 ? '−' : '+') + self.rp(t.amt),
        color: t.amt < 0 ? '#B42318' : '#1E6B40',
        divider: g.items.length ? '2px dashed #E3DACB' : 'none'
      });
    });
    groups.forEach(function (g) { g.sum = (g.total < 0 ? '−' : '+') + self.rp(g.total); });
    var defs = [{ id: 'all', label: 'Semua' }, { id: 'out', label: 'Pengeluaran' }, { id: 'in', label: 'Pemasukan' }];
    var net = inSum - outSum;
    return {
      totalIn: this.rp(inSum), totalOut: this.rp(outSum), net: (net < 0 ? '−' : '') + this.rp(net),
      q: s.q, groups: groups, isEmpty: groups.length === 0,
      emptyTitle: data.length === 0 ? 'Belum ada transaksi' : 'Tidak ditemukan',
      emptyBody: data.length === 0 ? 'Ketuk tombol + untuk mencatat yang pertama.' : 'Coba kata kunci atau filter lain.',
      filters: defs.map(function (f) { var on = s.filter === f.id; return { label: f.label, on: on, bg: on ? '#1F1B2D' : '#FFFDF8', pick: function () { self.setState({ filter: f.id }); } }; }),
      onQ: function (ev) { self.setState({ q: ev.target.value }); }
    };
  }
}
</script>
</body>
</html>
