<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Flowca — Menghubungkan akun Google</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#1F1B2D}a:hover{color:#C2321F}
.btn{transition:transform .08s ease, box-shadow .08s ease;cursor:pointer}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #1F1B2D !important}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #1F1B2D !important}
:focus-visible{outline:3px solid #2A8FA0;outline-offset:2px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hop{animation:hop .6s steps(3) infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFF6E5; color: #1F1B2D; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="background: #1F1B2D; color: #FFF6E5; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; padding: 7px 16px; display: flex; align-items: center; gap: 8px">
<span style="width: 8px; height: 8px; background: #FFA94D; display: inline-block"></span>
<span>MODE PROTOTIPE · callback disimulasikan</span>
</div>
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 22px">
<div style="align-self: center; font-family: 'Space Mono', monospace; font-size: 12px; background: #FFFDF8; border: 2px solid #1F1B2D; border-radius: 6px; padding: 6px 10px">/auth/callback?code=••••&amp;state=••••</div>
<div style="display: flex; justify-content: center; padding-top: 24px">
<div class="{{ hopClass }}">
<svg viewBox="0 0 16 14" shape-rendering="crispEdges" aria-hidden="true" style="width: 112px; height: 98px; display: block"><path fill="#1F1B2D" d="M5 0h6v1h-6zM3 1h2v1h-2zM11 1h2v1h-2zM2 2h1v1h-1zM13 2h1v1h-1zM1 3h1v1h-1zM14 3h1v1h-1zM1 4h1v1h-1zM14 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM10 5h1v1h-1zM15 5h1v1h-1zM0 6h1v1h-1zM6 6h1v1h-1zM10 6h1v1h-1zM15 6h1v1h-1zM0 7h1v1h-1zM15 7h1v1h-1zM0 8h1v1h-1zM15 8h1v1h-1zM0 9h1v1h-1zM5 9h1v1h-1zM10 9h1v1h-1zM15 9h1v1h-1zM1 10h1v1h-1zM6 10h4v1h-4zM14 10h1v1h-1zM1 11h1v1h-1zM14 11h1v1h-1zM2 12h2v1h-2zM12 12h2v1h-2zM4 13h8v1h-8z"/><path fill="#F08A24" d="M5 1h6v1h-6zM3 2h2v1h-2zM11 2h2v1h-2zM2 3h1v1h-1zM13 3h1v1h-1zM2 4h1v1h-1zM13 4h1v1h-1zM1 5h1v1h-1zM14 5h1v1h-1zM1 6h1v1h-1zM14 6h1v1h-1zM1 7h1v1h-1zM14 7h1v1h-1zM1 8h1v1h-1zM14 8h1v1h-1zM1 9h1v1h-1zM14 9h1v1h-1zM2 10h1v1h-1zM13 10h1v1h-1zM2 11h2v1h-2zM12 11h2v1h-2zM4 12h8v1h-8z"/><path fill="#FFC46B" d="M5 2h6v1h-6zM3 3h2v1h-2zM7 3h6v1h-6zM3 4h1v1h-1zM6 4h7v1h-7zM2 5h4v1h-4zM7 5h3v1h-3zM11 5h3v1h-3zM2 6h4v1h-4zM7 6h3v1h-3zM11 6h3v1h-3zM2 7h12v1h-12zM2 8h1v1h-1zM5 8h6v1h-6zM13 8h1v1h-1zM2 9h3v1h-3zM6 9h4v1h-4zM11 9h3v1h-3zM3 10h3v1h-3zM10 10h3v1h-3zM4 11h8v1h-8z"/><path fill="#FFF6E5" d="M5 3h2v1h-2zM4 4h2v1h-2z"/><path fill="#FF8FB8" d="M3 8h2v1h-2zM11 8h2v1h-2z"/></svg>
</div>
</div>
<div role="status" aria-live="polite" style="display: flex; flex-direction: column; gap: 6px; text-align: center">
<h1 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 26px; font-weight: 700">{{ title }}</h1>
<p style="margin: 0; font-size: 15px; color: #4A4458; line-height: 1.45">{{ body }}</p>
</div>
<ol style="list-style: none; margin: 0; padding: 16px; background: #FFFDF8; border: 3px solid #1F1B2D; border-radius: 14px; box-shadow: 6px 6px 0 #1F1B2D; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ steps }}" as="st" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: {{ st.color }}">
<span aria-hidden="true" style="width: 24px; height: 24px; border: 3px solid #1F1B2D; background: {{ st.box }}; display: flex; align-items: center; justify-content: center; font-family: 'Pixelify Sans', monospace; font-size: 14px; flex: none">{{ st.mark }}</span>
<span>{{ st.label }}</span>
</li>
</sc-for>
</ol>
<sc-if value="{{ showActions }}" hint-placeholder-val="{{ false }}">
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a href="{{ primaryHref }}" class="btn" style="height: 54px; border: 3px solid #1F1B2D; border-radius: 10px; background: {{ primaryBg }}; box-shadow: 4px 4px 0 #1F1B2D; display: flex; align-items: center; justify-content: center; font-family: 'Pixelify Sans', monospace; font-size: 20px; font-weight: 700; color: #1F1B2D; text-decoration: none">{{ primaryLabel }}</a>
<sc-if value="{{ showSecondary }}" hint-placeholder-val="{{ false }}">
<a href="Main.dc.html" style="text-align: center; font-size: 15px; font-weight: 700; padding: 10px 0">Masuk pakai email saja</a>
</sc-if>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["newUser","returning","cancelled","error"],"default":"newUser","section":"Simulasi"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tick: 0 };
  }
  componentDidMount() { this.run(); }
  componentDidUpdate(prev) { if (prev.result !== this.props.result) this.run(); }
  componentWillUnmount() { clearInterval(this.iv); }
  run() {
    var self = this;
    clearInterval(this.iv);
    this.setState({ tick: 0 });
    this.iv = setInterval(function () {
      var t = self.state.tick + 1;
      self.setState({ tick: t });
      if (t >= 3) clearInterval(self.iv);
    }, 900);
  }
  renderVals() {
    var r = this.props.result ?? 'newUser';
    var t = this.state.tick;
    var fail = r === 'cancelled' || r === 'error';
    var labels = ['Menerima respons dari Google', 'Memverifikasi akun di server', 'Menyiapkan sesi Flowca'];
    var failAt = r === 'cancelled' ? 0 : 1;
    var steps = labels.map(function (label, i) {
      var done = t > i && !(fail && i >= failAt);
      var failed = fail && t > i && i === failAt;
      var active = !done && !failed && t === i && !(fail && i > failAt);
      return {
        label: label,
        mark: failed ? '×' : (done ? '✓' : (active ? '…' : '')),
        box: failed ? '#FF7A6B' : (done ? '#5BC8D6' : (active ? '#FFE7C2' : '#FFFFFF')),
        color: (done || active || failed) ? '#1F1B2D' : '#6B6478'
      };
    });
    var finished = fail ? t > failAt : t >= 3;
    var copy = {
      newUser: ['Selamat datang di Flowca!', 'Akun Google-mu terhubung. Yuk siapkan dompet digitalmu.', 'Mulai onboarding', 'Onboarding.dc.html', '#5BC8D6'],
      returning: ['Selamat datang kembali!', 'Sesi tersimpan, kamu tetap masuk walau halaman di-refresh.', 'Buka dashboard', 'ProfileMenu.dc.html', '#5BC8D6'],
      cancelled: ['Masuk dibatalkan', 'Kamu menutup jendela Google sebelum selesai. Tidak ada yang berubah.', 'Kembali ke login', 'Main.dc.html', '#FF7A6B'],
      error: ['Ups, ada kendala', 'Google tidak bisa memverifikasi akunmu barusan. Coba lagi sebentar.', 'Coba lagi', 'Main.dc.html', '#FFA94D']
    }[r];
    return {
      hopClass: finished ? '' : 'hop',
      title: finished ? copy[0] : 'Menghubungkan akun Google…',
      body: finished ? copy[1] : 'Sebentar ya, jangan tutup halaman ini.',
      steps: steps,
      showActions: finished,
      primaryLabel: copy[2], primaryHref: copy[3], primaryBg: copy[4],
      showSecondary: fail
    };
  }
}
</script>
</body>
</html>
